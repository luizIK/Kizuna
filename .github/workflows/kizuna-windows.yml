name: kizuna-windows

# Kizuna: Windows build of this fork, based on Fritchii v5.8.4. MinGW clang with the repo's PGO
# profile, the same build release-binaries.yml calls windows-x86_64-pgo. The MSVC build is not
# used: frizti_settings.cpp declares parameters named `values`, which MSVC rejects (C4459, an
# error here). Warnings are not errors (ENABLE_WERROR=OFF): clang's -Wshadow also stops v5.8.4,
# in nx2_video_decoder.cpp. release-binaries.yml (the upstream workflow) is left untouched.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the zip as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - kizuna

permissions:
  contents: read

concurrency:
  group: kizuna-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x86_64 (MinGW PGO)
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check PGO profile
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      # The package list is docs/Deps.md (MSYS2) plus what the bundled FFmpeg needs to compile.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: kizuna-cpm-mingw-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            kizuna-cpm-mingw-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: kizuna-objects-mingw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kizuna-objects-mingw-

      # The update checker is on: Kizuna builds (LICHII_BUILD_TAG kizuna-N) look for newer
      # kizuna-build-N releases of luizIK/Kizuna only (frontend_common/update_checker.cpp), never
      # Fritchii's, and install them in place (Help > Check for Updates).
      - name: Configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          # Kizuna is built for one PC (Ryzen 5 5600, Zen 3): AVX2/FMA/BMI2 everywhere
          # (x86-64-v3, which the build runners have too) and scheduling for Zen 3.
          cpu="-march=x86-64-v3 -mtune=znver3"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DENABLE_WERROR=OFF \
            -DLICHII_BUILD_TAG=kizuna-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-pgo \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile $cpu" \
            "-DCMAKE_CXX_FLAGS=$profile $cpu"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          # -k 0: keep going past a failed file, so one run lists every error.
          cmake --build build/release --target yuzu yuzu-cmd --parallel -- -k 0
          ccache --show-stats

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # A dynamic MinGW build is not portable on its own: windeployqt6 brings the Qt libraries and
      # plugins, then every non-system DLL the binaries and those plugins pull in gets copied next
      # to them.
      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              # The system DLLs ship with Windows, so they never need bundling.
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in lichii.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/release/bin/* -DestinationPath "Kizuna-windows-x86_64-pgo.zip"
          Get-Item Kizuna-windows-x86_64-pgo.zip | Select-Object Name, Length

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: Kizuna-windows-x86_64-pgo
          path: Kizuna-windows-x86_64-pgo.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create release
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="kizuna-build-${GITHUB_RUN_NUMBER}"
          # The commit message is what the in-app updater shows as the release notes.
          notes="$(git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' || true)"
          notes="${notes}

          Extract the zip and run lichii.exe, or use Help > Check for Updates in Kizuna."
          gh release create "$tag" Kizuna-windows-x86_64-pgo.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Kizuna build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "$notes"
